<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0f19">
  <title>STIMboard</title>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Embedded Cartoon Trumpet SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%231e293b' stroke='%23f59e0b' stroke-width='6'/%3E%3Cg stroke='%23090d16' stroke-width='4' stroke-linejoin='round'%3E%3Crect x='46' y='40' width='8' height='22' fill='%23e2e8f0'/%3E%3Crect x='58' y='40' width='8' height='22' fill='%23e2e8f0'/%3E%3Crect x='70' y='40' width='8' height='22' fill='%23e2e8f0'/%3E%3Crect x='44' y='35' width='12' height='6' rx='2' fill='%23fbbf24'/%3E%3Crect x='56' y='35' width='12' height='6' rx='2' fill='%23fbbf24'/%3E%3Crect x='68' y='35' width='12' height='6' rx='2' fill='%23fbbf24'/%3E%3Crect x='40' y='64' width='42' height='20' rx='10' fill='none' stroke='%23d97706' stroke-width='6'/%3E%3Cpolygon points='18,54 30,58 30,66 18,70' fill='%23e2e8f0'/%3E%3Crect x='30' y='57' width='56' height='10' fill='%23fbbf24'/%3E%3Cpolygon points='84,57 108,36 108,88 84,67' fill='%23fbbf24'/%3E%3Cellipse cx='108' cy='62' rx='5' ry='26' fill='%23d97706'/%3E%3C/g%3E%3C/svg%3E">

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="./styles.css?v=2">
</head>
<body>

  <!-- Fullscreen Canvas for Confetti -->
  <canvas id="confettiCanvas"></canvas>

  <main class="app-container">
    <header>
      <div class="brand">
        <!-- Cartoon Trumpet SVG Badge -->
        <svg class="brand-icon" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
          <rect width="128" height="128" rx="28" fill="#1e293b" stroke="#f59e0b" stroke-width="6"/>
          <g stroke="#090d16" stroke-width="4" stroke-linejoin="round">
            <rect x="46" y="40" width="8" height="22" fill="#e2e8f0"/>
            <rect x="58" y="40" width="8" height="22" fill="#e2e8f0"/>
            <rect x="70" y="40" width="8" height="22" fill="#e2e8f0"/>
            <rect x="44" y="35" width="12" height="6" rx="2" fill="#fbbf24"/>
            <rect x="56" y="35" width="12" height="6" rx="2" fill="#fbbf24"/>
            <rect x="68" y="35" width="12" height="6" rx="2" fill="#fbbf24"/>
            <rect x="40" y="64" width="42" height="20" rx="10" fill="none" stroke="#d97706" stroke-width="6"/>
            <polygon points="18,54 30,58 30,66 18,70" fill="#e2e8f0"/>
            <rect x="30" y="57" width="56" height="10" fill="#fbbf24"/>
            <polygon points="84,57 108,36 108,88 84,67" fill="#fbbf24"/>
            <ellipse cx="108" cy="62" rx="5" ry="26" fill="#d97706"/>
          </g>
        </svg>
        <h1>STIMboard</h1>
      </div>
      <span class="pill" id="slotCounter">Loading...</span>
    </header>

    <!-- Native Android Install Banner -->
    <button id="installBtn" class="install-btn">📲 Install STIMboard App</button>

    <!-- Dynamic Mount Points -->
    <div id="heroSlot"></div>
    <div id="featuredSlot"></div>
    <div id="gridContainer"></div>

    <footer id="appFooter">
      Tap 3 dots &rarr; "Add to Home screen" for the full app experience
    </footer>
  </main>

  <!-- Modular Scripts (Loaded in Dependency Order) -->
  <script src="./data.js?v=2"></script>
  <script src="./synth.js?v=2"></script>
  <script src="./app.js?v=2"></script>
</body>
</html>
