<!DOCTYPE html>
<!-- The doctype above MUST stay the very first line so browsers use standards mode. -->
<!--
  ============================================================================
  STIMboard - index.html (the page shell)
  ----------------------------------------------------------------------------
  This file is intentionally almost empty of content. It only provides:
    - <head>: metadata, PWA hooks (manifest/icons), the favicon, the stylesheet
    - <body>: a few EMPTY mount points that app.js fills in at runtime
              (#heroSlot, #featuredSlot, #gridContainer) plus the header,
              the install button and the footer hint
    - three <script> tags at the very end that load the logic in order
  Every button you see is generated by app.js from the list in data.js.

  CACHE-BUSTING REMINDER: the "?v=N" on the stylesheet and script URLs forces
  phones to re-download a file. Whenever you edit styles.css / data.js /
  synth.js / app.js, bump THAT file's ?v= number below, AND bump CACHE_NAME in
  sw.js. (Current: styles v10, log v1, data v10, synth v7, extras v9, app v12, sw cache v22.)
  ============================================================================
-->
<html lang="en"> <!-- lang helps screen readers and translation tools -->
<head>
  <!-- Text encoding. Must be first so emoji and symbols decode correctly. -->
  <meta charset="UTF-8">
  <!-- MOBILE LAYOUT: width=device-width matches the phone's screen width;
       initial-scale=1.0 means no zoom on load; maximum-scale=1.0 plus
       user-scalable=no DISABLE pinch-zoom so rapid soundboard taps are never
       misread as a double-tap zoom. (Trade-off: this hurts accessibility.) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Colors the browser/status bar to match the app background (--bg in styles.css). -->
  <meta name="theme-color" content="#0b0f19">
  <!-- Text shown in the browser tab (the installed app name comes from manifest.json). -->
  <title>STIMboard</title>

  <!-- PWA Manifest & Icons -->
  <!-- The manifest tells Android the app's name, colors, start URL and icons;
       it is what makes "Add to Home screen" / installation possible. -->
  <link rel="manifest" href="./manifest.json">
  <!-- The icon iOS Safari uses for "Add to Home Screen" (it ignores the manifest icons). -->
  <link rel="apple-touch-icon" href="./icon-192-v2.png">
  <!-- Tells Android Chrome the page may run as a standalone app (no browser bars). -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Embedded Cartoon Trumpet SVG Favicon -->
  <!-- The favicon is an SVG written INLINE as a "data:" URL (URL-encoded:
       %3C = '<', %3E = '>', %23 = '#'), so it needs no separate file and works
       offline. It draws a rounded dark square, a gold border, three piston
       valves, and the trumpet body and bell. It is the same artwork as the
       <svg class="brand-icon"> in the header below. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%231e293b' stroke='%23f59e0b' stroke-width='6'/%3E%3Cg stroke='%23090d16' stroke-width='4' stroke-linejoin='round'%3E%3Crect x='46' y='40' width='8' height='22' fill='%23e2e8f0'/%3E%3Crect x='58' y='40' width='8' height='22' fill='%23e2e8f0'/%3E%3Crect x='70' y='40' width='8' height='22' fill='%23e2e8f0'/%3E%3Crect x='44' y='35' width='12' height='6' rx='2' fill='%23fbbf24'/%3E%3Crect x='56' y='35' width='12' height='6' rx='2' fill='%23fbbf24'/%3E%3Crect x='68' y='35' width='12' height='6' rx='2' fill='%23fbbf24'/%3E%3Crect x='40' y='64' width='42' height='20' rx='10' fill='none' stroke='%23d97706' stroke-width='6'/%3E%3Cpolygon points='18,54 30,58 30,66 18,70' fill='%23e2e8f0'/%3E%3Crect x='30' y='57' width='56' height='10' fill='%23fbbf24'/%3E%3Cpolygon points='84,57 108,36 108,88 84,67' fill='%23fbbf24'/%3E%3Cellipse cx='108' cy='62' rx='5' ry='26' fill='%23d97706'/%3E%3C/g%3E%3C/svg%3E">

  <!-- External Stylesheet -->
  <!-- All visual styling lives in styles.css. Bump ?v=3 when that file changes. -->
  <link rel="stylesheet" href="./styles.css?v=10">
</head>
<body>

  <!-- Fullscreen Canvas for Confetti -->
  <!-- Fixed over the whole screen; pointer-events:none in CSS lets taps pass
       through to the buttons beneath. app.js draws the particles on it. -->
  <canvas id="confettiCanvas"></canvas>

  <!-- <main> = the primary content. .app-container caps the width at 480px
       and centers it, so the app looks like a phone layout even on desktop. -->
  <main class="app-container">
    <!-- Top bar: logo + name on the left, "N Stims" counter pill on the right. -->
    <header>
      <div class="brand">
        <!-- Cartoon Trumpet SVG Badge -->
        <!-- Inline SVG on a 128x128 canvas (scaled to 34px by CSS). Shapes, in order:
             dark rounded square with gold outline; three white valve stems and
             three gold valve caps; an orange looped tuning pipe; a white mouthpiece;
             the gold tube; the flared bell; and the orange bell opening. -->
        <svg class="brand-icon" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
          <rect width="128" height="128" rx="28" fill="#1e293b" stroke="#f59e0b" stroke-width="6"/>
          <g stroke="#090d16" stroke-width="4" stroke-linejoin="round">
            <rect x="46" y="40" width="8" height="22" fill="#e2e8f0"/>
            <rect x="58" y="40" width="8" height="22" fill="#e2e8f0"/>
            <rect x="70" y="40" width="8" height="22" fill="#e2e8f0"/>
            <rect x="44" y="35" width="12" height="6" rx="2" fill="#fbbf24"/>
            <rect x="56" y="35" width="12" height="6" rx="2" fill="#fbbf24"/>
            <rect x="68" y="35" width="12" height="6" rx="2" fill="#fbbf24"/>
            <rect x="40" y="64" width="42" height="20" rx="10" fill="none" stroke="#d97706" stroke-width="6"/>
            <polygon points="18,54 30,58 30,66 18,70" fill="#e2e8f0"/>
            <rect x="30" y="57" width="56" height="10" fill="#fbbf24"/>
            <polygon points="84,57 108,36 108,88 84,67" fill="#fbbf24"/>
            <ellipse cx="108" cy="62" rx="5" ry="26" fill="#d97706"/>
          </g>
        </svg>
        <h1>STIMboard</h1>
      </div>
      <!-- Placeholder text; app.js replaces it with e.g. "21 Stims" once the buttons are built. -->
      <span class="pill" id="slotCounter">Loading...</span>
    </header>

    <!-- Native Android Install Banner -->
    <!-- Hidden by CSS (display:none). app.js reveals it only when the browser
         fires 'beforeinstallprompt', and hides it again after install.
         The leading emoji is the "mobile phone with arrow" icon. This file must be
         saved as UTF-8 or the emoji turns into "??". -->
    <button id="installBtn" class="install-btn">📲 Install STIMboard App</button>

    <!-- Dynamic Mount Points -->
    <!-- These three divs start EMPTY. app.js (renderSoundboard) fills them:
           #heroSlot      -> the red CASE! card
           #featuredSlot  -> the gold Trumpet card and the purple Birthday card
           #gridContainer -> all grouped grids and collapsible accordions -->
    <div id="heroSlot"></div>
    <div id="featuredSlot"></div>
    <div id="gridContainer"></div>

    <!-- Install hint for people who open the app in a normal browser tab.
         styles.css hides it automatically in installed/standalone mode. -->
    <footer id="appFooter">
      Tap 3 dots &rarr; "Add to Home screen" for the full app experience
    </footer>
  </main>

  <!-- Modular Scripts (Loaded in Dependency Order) -->
  <!-- ORDER MATTERS, and the scripts sit at the end of <body> so the DOM
       above already exists when they run:
         1. data.js  defines window.SOUNDBOARD_DATA
         2. synth.js defines window.playProceduralSound
         3. app.js   uses both of the above to build the UI and play sounds
       Each ?v=N is a cache-buster: bump it when that file changes. -->
  <script src="./log.js?v=1"></script>
  <script src="./data.js?v=10"></script>
  <script src="./synth.js?v=7"></script>
  <script src="./extras.js?v=9"></script>
  <script src="./app.js?v=12"></script>
</body>
</html>
